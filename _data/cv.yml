    Experience:
      - company: Independent Research
        position: Independent Researcher
        location: China
        url: https://github.com/TheLovesOfLadyPurple
        start_date: 2022
        end_date: Present
        summary: Conducting independent research on diffusion models, fast numerical ODE solvers, diffusion distillation diversity, and generative AI trustworthiness.
        highlights:
          - "**RAIN (BMVC 2026 TrustVis Workshop, Oral):** Proposed a prompt-free, U-Net-free, dual-branch NAFNet architecture for one-step Gaussian-Shading semantic watermark extraction, achieving **47.4× fewer FLOPs** (`14.394 GFLOPs`), **56× fewer parameters** (`15.468M`), and **1.39 ms/image** parallel inference (**22.5×–26.8× speedup** over OSI and FARI) with **99.99%** clean bit accuracy."
          - "**F-scheduler (Under Review at TMLR):** Designed a training-free time and Free-U skip-connection schedule for few-step diffusion ODE solvers (UniPC, DPM++ 2M), generating `1024×1024` SDXL images in **6 steps** and `512×512` SD 1.5 images in **5 steps** while outperforming SOTA distillation models (e.g., DMD2 LoRA) and 20-step DPM++ 2M in FID."
          - "**EMPURPLE (Preprint):** Analyzed mode collapse and train–test distribution shift in distilled diffusion models via a PAC-style generalization bound and the Information Bottleneck principle; proposed a training-free intermediate-latent recycling algorithm that improves FID by **7%–20%** across DMD2 (**+20% FID**), Hyper-SD, FlashSD, and SDXL-Lightning."
          - "**Open-Source & Community Demos:** Contributed a merged scheduler bug fix to **Hugging Face Diffusers** ([PR #14011](https://github.com/huggingface/diffusers/pull/14011)) and deployed interactive Gradio demos on [Hugging Face Spaces (`coralLight`)](https://huggingface.co/coralLight)."

      - company: Industry Software Engineering
        position: Software Engineer
        location: China
        start_date: 2023
        end_date: Present
        summary: Full-time software development engineer building production client architectures, interactive UI/animation pipelines, and high-performance application systems alongside independent AI research.
        highlights:
          - Architected modular application components, asynchronous state management (MVVM), and high-frame-rate rendering workflows.
          - Built reproducible evaluation pipelines, multi-GPU CUDA stream inference benchmarks, and interactive Gradio web applications for generative vision models.

    Publications:
      - title: "RAIN: Region-Aware Inversion Network for Semantic Watermark Extraction"
        authors:
          - Zilai Li
        publisher: "BMVC 2026 Workshop on Trustworthy Visual Computing (TrustVis) — Accepted for Oral Presentation (arXiv:2609.14856)"
        releaseDate: 2026-09-14
        url: https://github.com/TheLovesOfLadyPurple/RAIN-lightweight-NN-for-one-step-semantic-watermark-extraction
        summary: >
          A lightweight, prompt-free, one-step semantic watermark extractor that decomposes high-SNR endpoint recovery into parallel anchor and residual NAFNet branches. Reduces compute by 47.4× (14.394 GFLOPs vs. ~680 GFLOPs) and latency to 1.39 ms/image while matching 50-step DDIM Inversion accuracy (99.99%) and maintaining robustness across 10 image distortions.

      - title: "F-scheduler: Illuminating the Free-Lunch Design Space for Fast Sampling of Diffusion Models"
        authors:
          - Zilai Li
          - Lujia Bai
        publisher: "Under Review at Transactions on Machine Learning Research (TMLR) (arXiv:2510.02390)"
        releaseDate: 2025-09-30
        url: https://github.com/TheLovesOfLadyPurple/F-scheduler
        summary: >
          Proposes a training-free ODE solver time schedule that preserves terminal KL-regularized latent variance for the β-VAE decoder and coordinates stage-wise Free-U Net skip-connection modulation. Achieves 6-step 1024×1024 and 5-step 512×512 generation with UniPC and DPM++ 2M, outperforming SOTA diffusion distillation models and 20-step solvers in FID.

      - title: "EMPURPLE: A Free Lunch for Diffusion Distillation based on the Information Bottleneck"
        authors:
          - Zilai Li
          - Lujia Bai
        publisher: "Working Paper / Preprint (arXiv:2607.04276)"
        releaseDate: 2026-07-05
        url: https://github.com/TheLovesOfLadyPurple/Empurple-Training-Free-Algorithm-To-enhance-Diversity-of-The-Diffusion-Distillation-Model
        summary: >
          Establishes a PAC-style theoretical link between aggressive early-step velocity redirection and intermediate latent distribution shift in diffusion distillation. Introduces a model-agnostic, training-free latent recycling method that restores generation diversity and improves FID by 7%–20% across DMD2, Hyper-SD, FlashSD, and SDXL-Lightning.

    Projects:
      - name: "RAIN: One-Step Semantic Watermark Extraction"
        start_date: 2026
        end_date: 2026
        url: https://github.com/TheLovesOfLadyPurple/RAIN-lightweight-NN-for-one-step-semantic-watermark-extraction
        summary: Official PyTorch implementation and theoretical notes for RAIN (Accepted Oral at BMVC 2026 TrustVis Workshop).
        highlights:
          - Concurrent dual-stream NAFNet inference (`14.394 GFLOPs`, `15.468M` params, `1.39 ms/image` on dual NVIDIA A800 GPUs).
          - Includes closed-form Test-Function & Taylor expansion proof explaining why endpoint-jumping distilled models (LCM/DMD2) cannot use deterministic DDIM Inversion.

      - name: "F-scheduler: Fast Training-Free ODE Sampling for Diffusion Models"
        start_date: 2025
        end_date: 2026
        url: https://github.com/TheLovesOfLadyPurple/F-scheduler
        summary: Training-free scheduler for 5–6 step high-resolution diffusion sampling (Under Review at TMLR), with interactive Hugging Face Spaces.
        highlights:
          - "Live interactive demos on Hugging Face Spaces: [DMD2 vs. F-Scheduler](https://huggingface.co/spaces/coralLight/DMD2vsF-Scheduler), [F-scheduler 4K](https://huggingface.co/spaces/coralLight/F-scheduler-4k), [F-scheduler DreamshaperXL](https://huggingface.co/spaces/coralLight/F-scheduler-DreamshaperXL), and [F-scheduler Animation](https://huggingface.co/spaces/coralLight/F-scheduler-Animation)."
          - Outperforms DMD2 LoRA in structural detail and texture fidelity using Analytical First Step (AFS) + custom timestep scheduling.

      - name: "EMPURPLE: Training-Free Diversity Enhancement for Distilled Diffusion Models"
        start_date: 2026
        end_date: 2026
        url: https://github.com/TheLovesOfLadyPurple/Empurple-Training-Free-Algorithm-To-enhance-Diversity-of-The-Diffusion-Distillation-Model
        summary: Training-free intermediate-latent recycling to eliminate mode collapse in few-step distilled diffusion samplers.
        highlights:
          - "Live interactive comparison on Hugging Face Spaces: [coralLight/EMPURPLE](https://huggingface.co/spaces/coralLight/EMPURPLE) and [Google Colab Demo](https://colab.research.google.com/drive/1DVw41J_7yzhBxRhhNeOsCFxz-ROZWHLw?usp=sharing)."
          - Reuses cached noisy latents (e.g., SDXL UniPC at timestep 852) to boost FID by up to 20% on DMD2 without retraining.

      - name: "Hugging Face Diffusers Open-Source Contribution"
        start_date: 2026
        end_date: 2026
        url: https://github.com/huggingface/diffusers/pull/14011
        summary: Merged scheduler bug fix for the Hugging Face Diffusers library.
        highlights:
          - "**Merged PR [#14011](https://github.com/huggingface/diffusers/pull/14011):** Fixed custom timestep shifting inconsistency in `FlowMatchEulerDiscreteScheduler.set_timesteps` when `shift != 1`, ensuring consistency between custom `timesteps` and `num_inference_steps` schedules for Rectified Flow / Flow Matching solvers."

